name: Organisation PR label policy

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner selector passed to fromJSON (labels or a runner-group object)
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate mutually exclusive PR labels
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - name: Read live labels and enforce the organisation taxonomy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Organisation PR label policy requires a pull_request event"
            exit 1
          fi

          # Deliberately NOT piped through jq. `runs-on` is selectable, so this
          # job may land on a self-hosted runner, and jq is not guaranteed
          # there the way curl and node are -- a required check that depends on
          # an optional tool blocks every PR in every consuming repo the first
          # time it lands somewhere without it. node already parses the payload
          # below, so extracting the labels there costs nothing and removes the
          # dependency. Validation semantics are unchanged: a payload whose
          # labels are absent, non-array, or carry a non-string name still
          # raises the same malformed-label-set error.
          pull_request_json="$(
            curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"
          export PULL_REQUEST_JSON="$pull_request_json"

          node <<'NODE'
          const pullRequest = JSON.parse(process.env.PULL_REQUEST_JSON);
          const labels = Array.isArray(pullRequest.labels)
            ? pullRequest.labels.map((label) => label && label.name)
            : null;
          if (!Array.isArray(labels) || labels.some((label) => typeof label !== 'string')) {
            throw new Error('GitHub returned a malformed pull-request label set');
          }

          const changeTypes = new Set(['bug', 'enhancement', 'documentation', 'type:tech-debt']);
          const pillars = new Set(Array.from({ length: 8 }, (_, index) => `pillar-${index + 1}`));
          const changeTypeMatches = [...new Set(labels.filter((label) => changeTypes.has(label)))];
          const pillarMatches = [...new Set(labels.filter((label) => pillars.has(label)))];
          const invalidPillarLabels = [...new Set(labels.filter((label) =>
            /^pillar(?:$|[-_: /])/i.test(label) && !pillars.has(label),
          ))];

          const failures = [];
          if (changeTypeMatches.length !== 1) {
            failures.push(`expected exactly one change type (${[...changeTypes].join(', ')}); observed ${changeTypeMatches.length}`);
          }
          if (pillarMatches.length !== 1) {
            failures.push(`expected exactly one canonical pillar (pillar-1 … pillar-8); observed ${pillarMatches.length}`);
          }
          if (invalidPillarLabels.length > 0) {
            failures.push(`remove non-canonical pillar-like labels: ${invalidPillarLabels.join(', ')}`);
          }

          if (failures.length > 0) {
            for (const failure of failures) console.error(`::error::${failure}`);
            process.exit(1);
          }
          console.log(`Validated change type ${changeTypeMatches[0]} and mutually exclusive strategy pillar ${pillarMatches[0]}.`);
          NODE
