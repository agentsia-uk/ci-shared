name: CI

# Self-CI: dogfood the shared secrets-scan on this repo's own contents.
# Same-repo reusable-workflow calls use a local path ref (no SHA pin needed);
# external consumers MUST SHA-pin (see README).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pr-label-policy:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-label-policy.yml
    permissions:
      contents: read
      pull-requests: read

  secrets-scan:
    uses: ./.github/workflows/shared-secrets-scan.yml
    with:
      gitleaks-version: "8.21.2"
      runs-on: '["ubuntu-latest"]'
    permissions:
      contents: read

  code-health-policy-tests:
    name: Code health policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scanner and run policy regressions
        run: |
          tool_dir=$(mktemp -d "${RUNNER_TEMP:?}/code-health-tool.XXXXXXXX")
          python -I -m venv "$tool_dir"
          "$tool_dir/bin/python" -I -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r code_health/requirements.lock
          "$tool_dir/bin/python" -I code_health/scanner_patch.py
          unset PYTHONPATH PYTHONHOME
          "$tool_dir/bin/python" -m unittest discover -s tests -v
          CODE_HEALTH_READER_INTEGRATION=1 "$tool_dir/bin/python" -m unittest tests.test_readers_integration -v

  qualification-container-boundary:
    name: Qualification container boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QUALIFICATION_TEST_IMAGE: docker.io/library/python@sha256:3856e3e7bf4d0ba061501a84ed2eb0d429663307c0f54f191dc4de03c7081c3e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch pinned probe image
        run: docker pull "$QUALIFICATION_TEST_IMAGE"
      - name: Test effective isolation in a real container
        run: python3 -m unittest tests.test_qualification_container_integration -v

  reader-arm64-integration:
    name: Reader integration (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify actual reader bundle and load every supported reader
        run: |
          tool_dir=$(mktemp -d "${RUNNER_TEMP:?}/code-health-tool.XXXXXXXX")
          python -I -m venv "$tool_dir"
          "$tool_dir/bin/python" -I -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r code_health/requirements.lock
          "$tool_dir/bin/python" -I code_health/scanner_patch.py
          unset PYTHONPATH PYTHONHOME
          CODE_HEALTH_READER_INTEGRATION=1 "$tool_dir/bin/python" -m unittest tests.test_readers_integration -v

  temporary-dismissal-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bd9fe200f98c58e3724df55ddf03ffedf0fe0e63
          fetch-depth: 0
          persist-credentials: false
          path: diagnostic-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: agentsia-uk/ci-shared/code_health@df210a1cf34f626cc5da0586271ae2310f615a38
        continue-on-error: true
        with:
          repository-path: ${{ github.workspace }}/diagnostic-source
          base-sha: bd0b89f27fafea4bb2359e644d03c2c2b6c52fc8
          head-sha: bd9fe200f98c58e3724df55ddf03ffedf0fe0e63
          output-path: ${{ runner.temp }}/diagnostic-state
      - name: Encrypt diagnostic state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/diagnostic-public.pem" <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyLCNqURrG/5RAVZv5bP9
          tnqwT47GrbSro30BSQY9jZhSH3lYVdQ6MXrxcfjPDWeMG/InGD3iUn1T82hsH7Zy
          3PI+t4uCH+il4vp4utLOo+zoBBUJfO/ukxv9pxq2TKzpt5bG7+6ho0FzR2tYarKE
          b46lwiX8Map2DtRIYQKepJGG18WceXKuYXAtF2gE5NogCgYtcSF1UujhkPZizc8N
          bZ3ynt3SfssyCBOwfUa7grL7m99Q8nbwDmxxHcwO8uzi8tcKEdtT092zkoeqrz0C
          cbKmxAUyTHSTeB3Uv9eXbIJZt1BGrI1qI65wn6GrhuuVycoAw2wJumSshwKR1BTT
          CQIDAQAB
          -----END PUBLIC KEY-----
          KEY
          openssl rand -hex 32 > "$RUNNER_TEMP/diagnostic-password"
          mkdir "$RUNNER_TEMP/encrypted-diagnostic"
          tar -C "$RUNNER_TEMP" -cf - diagnostic-state | openssl enc -aes-256-cbc -pbkdf2 -pass file:"$RUNNER_TEMP/diagnostic-password" -out "$RUNNER_TEMP/encrypted-diagnostic/state.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/diagnostic-public.pem" -in "$RUNNER_TEMP/diagnostic-password" -out "$RUNNER_TEMP/encrypted-diagnostic/password.enc"
          rm "$RUNNER_TEMP/diagnostic-password"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-dismissal-diagnostic
          path: ${{ runner.temp }}/encrypted-diagnostic
          if-no-files-found: error
