name: CI

# Self-CI: dogfood the shared secrets-scan on this repo's own contents.
# Same-repo reusable-workflow calls use a local path ref (no SHA pin needed);
# external consumers MUST SHA-pin (see README).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pr-label-policy:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-label-policy.yml
    permissions:
      contents: read
      pull-requests: read

  secrets-scan:
    uses: ./.github/workflows/shared-secrets-scan.yml
    with:
      gitleaks-version: "8.21.2"
      runs-on: '["ubuntu-latest"]'
    permissions:
      contents: read

  code-health-policy-tests:
    name: Code health policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scanner and run policy regressions
        run: |
          version=$(python -c 'import json; print(json.load(open("code_health/policy.json"))["desloppifyVersion"])')
          python -m pip install --disable-pip-version-check "desloppify[full]==${version}"
          python -m unittest discover -s tests -v
