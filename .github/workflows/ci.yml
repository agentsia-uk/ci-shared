name: CI

# Self-CI: dogfood the shared secrets-scan on this repo's own contents.
# Same-repo reusable-workflow calls use a local path ref (no SHA pin needed);
# external consumers MUST SHA-pin (see README).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pr-label-policy:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-label-policy.yml
    permissions:
      contents: read
      pull-requests: read

  secrets-scan:
    uses: ./.github/workflows/shared-secrets-scan.yml
    with:
      gitleaks-version: "8.21.2"
      runs-on: '["ubuntu-latest"]'
    permissions:
      contents: read

  code-health-policy-tests:
    name: Code health policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install scanner and run policy regressions
        run: |
          tool_dir=$(mktemp -d "${RUNNER_TEMP:?}/code-health-tool.XXXXXXXX")
          python -I -m venv "$tool_dir"
          "$tool_dir/bin/python" -I -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r code_health/requirements.lock
          "$tool_dir/bin/python" -I code_health/scanner_patch.py
          unset PYTHONPATH PYTHONHOME
          "$tool_dir/bin/python" -m unittest discover -s tests -v
          CODE_HEALTH_READER_INTEGRATION=1 "$tool_dir/bin/python" -m unittest tests.test_readers_integration -v
          DOCKER_BUILDKIT=1 docker build -f code_health/scanner.Dockerfile -t code-health-scanner-test:local .
          CODE_HEALTH_SCANNER_IMAGE=code-health-scanner-test:local "$tool_dir/bin/python" -m unittest tests.test_scanner_container_integration -v
          test_readers=$(mktemp -d "${RUNNER_TEMP:?}/code-health-test-readers.XXXXXXXX")
          "$tool_dir/bin/python" -I -c 'import runpy,sys; sys.path.insert(0,sys.argv.pop(1)); runpy.run_module("code_health.prepare_readers",run_name="__main__")' "$PWD" --destination "$test_readers"
          test_image=$(docker image inspect --format '{{.Id}}' code-health-scanner-test:local)
          CODE_HEALTH_TEST_IMAGE="$test_image" CODE_HEALTH_TEST_READERS="$test_readers" "$tool_dir/bin/python" -m unittest \
            tests.test_code_health.RatchetTests.test_cli_scans_real_git_snapshots_and_ignores_committed_local_state \
            tests.test_code_health.RatchetTests.test_new_area_has_no_fabricated_baseline_score \
            tests.test_code_health.RatchetTests.test_actual_scanner_rejects_new_security_defect -v

  qualification-container-boundary:
    name: Qualification container boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QUALIFICATION_TEST_IMAGE: docker.io/library/python@sha256:3856e3e7bf4d0ba061501a84ed2eb0d429663307c0f54f191dc4de03c7081c3e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch pinned probe image
        run: docker pull "$QUALIFICATION_TEST_IMAGE"
      - name: Test effective isolation in a real container
        run: python3 -m unittest tests.test_qualification_container_integration -v

  reader-arm64-integration:
    name: Reader integration (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify actual reader bundle and load every supported reader
        run: |
          tool_dir=$(mktemp -d "${RUNNER_TEMP:?}/code-health-tool.XXXXXXXX")
          python -I -m venv "$tool_dir"
          "$tool_dir/bin/python" -I -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r code_health/requirements.lock
          "$tool_dir/bin/python" -I code_health/scanner_patch.py
          unset PYTHONPATH PYTHONHOME
          CODE_HEALTH_READER_INTEGRATION=1 "$tool_dir/bin/python" -m unittest tests.test_readers_integration -v

  scanner-action-preparation:
    name: Draft scanner action preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare draft action
        uses: ./code_health
        continue-on-error: true
        with:
          repository-path: ${{ github.workspace }}
          base-sha: ${{ github.sha }}
          head-sha: ${{ github.sha }}
          output-path: ${{ runner.temp }}/code-health-action-smoke
      - name: Verify preparation completed
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CODE_HEALTH_SCANNER_IMAGE:-}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -f "${CODE_HEALTH_READERS:?}/libtree_sitter_nim.so"
          test -x "${CODE_HEALTH_PYTHON:?}"
          docker image inspect "$CODE_HEALTH_SCANNER_IMAGE" >/dev/null
