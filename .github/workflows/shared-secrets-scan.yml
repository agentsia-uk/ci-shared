name: Shared secrets scan

# Reusable secrets-scan workflow (issue #3237, council run-id cross-repo-cicd-3237).
#
# This is the SINGLE source of truth for the arch-aware gitleaks install +
# `gitleaks detect` step. It exists to kill the silent-drift cost #3237 calls
# out: gitleaks was hand-pinned to the same literal version in BOTH
# Modelsmith/ci.yml and agentsia-web/ci.yml, each with its own arch-detection
# shell, with nothing forcing them to stay equal.
#
# Phase 1 (this PR, in-session): Modelsmith hosts and consumes this workflow.
# This is a DELIBERATE, DOCUMENTED Rule-3 bridge (council U5): the durable home
# for org-shared reusable workflows is a dedicated `agentsia-uk/.github` org
# repo (GitHub's convention), which does NOT yet exist (verified 404 against the
# GitHub API at authoring time). Hosting Phase 1 inside Modelsmith proves the
# `workflow_call` interface and kills the version-drift bug now; the operator
# follow-up creates the org repo and migrates this workflow there, retiring the
# bridge. See docs/proposals/cross-repo-shared-cicd-3237.md and council
# docs/council-review/cross-repo-cicd-3237/SYNTHESIS.md U5.
#
# Phase 2 (operator/cross-repo follow-up): sibling repos adopt via
#   uses: <host>/.github/workflows/shared-secrets-scan.yml@<40-char-sha>
# Council S2: cross-repo `uses:` references MUST be pinned by a strict 40-char
# commit SHA, never a branch name or mutable tag. Council U1: cross-org
# `workflow_call` requires the host repo's "Allow access from <org>
# repositories" Actions setting to be flipped on by an operator before any
# sibling adoption PR can succeed.
#
# Behaviour:
#   - arch-detect (arm64|x64); UNSUPPORTED ARCH => error + exit 1 (fail-closed).
#   - download the pinned gitleaks release for the detected arch.
#   - `gitleaks detect` over the requested source-path + log-opts.
# This workflow is NEVER gated on docs-only: a markdown PR pasting a real
# credential is exactly the threat model it exists for (Modelsmith #1041).

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: >-
          Pinned gitleaks release to install. The contract baseline
          (config/cross-repo-release-contract.json qualityBaseline) is the
          machine-readable source of truth for this value; validateQualityBaseline()
          fails closed if the contract declares two repos on different versions.
        type: string
        default: "8.21.2"
      log-opts:
        description: >-
          git log range passed to `gitleaks detect --log-opts`. The caller
          computes this from its own diff range (e.g. BASE..HEAD); the default
          scans only the newest non-merge commit.
        type: string
        default: "--no-merges -1"
      source-path:
        description: Path to scan (relative to the checkout root).
        type: string
        default: "."
      runs-on:
        description: >-
          JSON-encoded runner label array for the scan job. A string input is
          required because `workflow_call` cannot pass a YAML sequence directly;
          the job parses it via fromJSON. Defaults to the Modelsmith self-hosted
          Linux CI pool.
        type: string
        default: '["self-hosted", "Linux", "ci"]'

permissions:
  contents: read

jobs:
  secrets-scan:
    # Static job name (NOT interpolated with the version) so the emitted
    # branch-protection context `secrets-scan / Secrets scan` is STABLE across
    # gitleaks-version bumps (issue #3237). The installed version is logged by
    # the install step for visibility.
    name: Secrets scan
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Install gitleaks (arch-aware, pinned)
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          echo "Installing gitleaks v${GITLEAKS_VERSION}"
          case "$(uname -m)" in
            aarch64|arm64) GITLEAKS_ARCH=arm64 ;;
            x86_64)        GITLEAKS_ARCH=x64 ;;
            *) echo "::error::Unsupported arch $(uname -m) for gitleaks install"; exit 1 ;;
          esac
          GITLEAKS_BIN_DIR="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$GITLEAKS_BIN_DIR"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz" \
            | tar -xz -C "$GITLEAKS_BIN_DIR" gitleaks
          echo "$GITLEAKS_BIN_DIR" >> "$GITHUB_PATH"

      - name: Secrets scan
        env:
          GITLEAKS_LOG_OPTS: ${{ inputs.log-opts }}
          GITLEAKS_SOURCE_PATH: ${{ inputs.source-path }}
        run: |
          set -euo pipefail
          gitleaks detect --source "$GITLEAKS_SOURCE_PATH" --no-banner --log-opts="$GITLEAKS_LOG_OPTS"
