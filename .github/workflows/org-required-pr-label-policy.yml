name: Organisation required PR label policy

on:
  pull_request_target:
    # Default types (opened, synchronize, reopened) don't include labeled/
    # unlabeled/ready_for_review. Labels can only be attached in a second API
    # call after the PR already exists, so an unlabelled-at-open PR fails this
    # required check permanently -- it never reruns to notice the label that
    # lands a few seconds later. That forced every PR-creating agent session
    # into a draft-then-label-then-flip-ready workaround just to dodge this
    # window, which is why PRs kept landing (and getting stuck) as drafts.
    # Add the missing types so the check self-heals the moment labels land,
    # removing the need for that workaround.
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  # A merge queue evaluates required checks against the merge-group commit, not
  # against the pull request. Without this trigger the workflow never runs
  # there, so the required context reports as "Expected — Waiting for workflow
  # to run" and the entry waits until the queue's status-check timeout drops
  # it, with nothing red to explain why. Observed on agentsia-uk/Modelsmith
  # #10438: `PR fast path` and `secrets-scan` both passed on the merge group
  # while this context never arrived.
  #
  # There is nothing to validate on a merge group. Label policy is an ADMISSION
  # property — GitHub enforces the pull request's required checks before it may
  # join the queue — and a merge group can contain several pull requests, so
  # there is no single `github.event.pull_request.number` to read. Both jobs
  # therefore no-op on this event and simply publish a passing context.
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  apply-declarations:
    name: Apply explicit PR label declarations
    if: github.event_name == 'pull_request_target'
    # 2026-08-28: this required-workflow ruleset (orgs/agentsia-uk/rulesets/
    # 20927979, ~ALL repos) was still on ubuntu-latest, hard-blocked by the
    # exhausted Enterprise Actions budget -- every PR in every repo in the
    # org was stuck on this one check. Neither job checks out contributor
    # code (label API calls only), so routing to self-hosted carries no
    # trust-boundary concern. ci-shared-shared-modelsmith-deploy is a new
    # runner enrolled specifically for this (agentsia-uk/Modelsmith
    # bootstrap/_lib/enrol-runner.sh + .github/workflows/enrol-ci-shared-runner.yml).
    runs-on: [self-hosted, Linux, ci]
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Apply declared labels without checking out contributor code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const labelCatalogue = new Map(Object.entries({
            bug: { description: 'Defect or regression' },
            documentation: { description: 'Documentation-only change' },
            enhancement: { description: 'Product or platform enhancement' },
            'type:tech-debt': { description: 'Technical debt reduction' },
            'pillar-1': { description: 'Closed Iterate Loop' },
            'pillar-2': { description: 'Agent-Native Operating Model' },
            'pillar-3': { description: 'Domain Specialist Factory' },
            'pillar-4': { description: 'Promotion and Governance Control Plane' },
            'pillar-5': { description: 'Config-Driven Model Lifecycle' },
            'pillar-6': { description: 'Compounding Knowledge Moat' },
            'pillar-7': { description: 'Fleet Intelligence and Infrastructure' },
            'pillar-8': { description: 'Agentic Experimentation' },
          }));
          const changeTypes = new Set(['bug', 'enhancement', 'documentation', 'type:tech-debt']);
          const pillars = new Set(Array.from({ length: 8 }, (_, index) => `pillar-${index + 1}`));
          const repository = process.env.REPOSITORY;
          const pullRequestNumber = Number(process.env.PR_NUMBER);
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function request(path, init = {}) {
            return fetch(`https://api.github.com/repos/${repository}${path}`, { ...init, headers });
          }

          function declaredPillars(body) {
            return [...new Set([...body.matchAll(
              /^\s*(?:[-*]\s*)?(?:\*\*)?(?:product strategy )?pillar(?:\*\*)?\s*:\s*(?:P|pillar-)([1-8])\b/gim,
            )].map((match) => `pillar-${match[1]}`))];
          }

          function declaredChangeTypes(body) {
            return [...new Set([...body.matchAll(
              /^\s*(?:[-*]\s*)?(?:\*\*)?change type(?:\*\*)?\s*:\s*(bug|enhancement|documentation|type:tech-debt)\b/gim,
            )].map((match) => match[1].toLowerCase()))];
          }

          function resolveOne(kind, existing, declared) {
            if (existing.length > 1) throw new Error(`multiple canonical ${kind} labels are already present`);
            if (declared.length > 1) throw new Error(`the PR body declares multiple ${kind} values`);
            if (existing.length === 1 && declared.length === 1 && existing[0] !== declared[0]) {
              throw new Error(`the existing ${kind} label conflicts with the PR body declaration`);
            }
            const resolved = existing[0] ?? declared[0];
            if (!resolved) throw new Error(`add one ${kind} label or declare it in the PR body before merge`);
            return resolved;
          }

          async function ensureLabel(name) {
            const metadata = labelCatalogue.get(name);
            if (!metadata) throw new Error(`cannot provision unknown canonical label ${name}`);
            const encoded = encodeURIComponent(name);
            const existing = await request(`/labels/${encoded}`);
            if (existing.ok) return;
            if (existing.status !== 404) throw new Error(`cannot inspect repository label ${name} (HTTP ${existing.status})`);
            const created = await request('/labels', {
              method: 'POST',
              body: JSON.stringify({
                name,
                color: 'ededed',
                description: metadata.description,
              }),
            });
            if (created.ok) return;
            if (created.status === 422 && (await request(`/labels/${encoded}`)).ok) return;
            throw new Error(`cannot create repository label ${name} (HTTP ${created.status})`);
          }

          async function main() {
            if (!repository || !Number.isSafeInteger(pullRequestNumber) || pullRequestNumber < 1) {
              throw new Error('organisation PR label policy requires a pull_request_target event');
            }
            await Promise.all([...labelCatalogue.keys()].map(ensureLabel));
            const response = await request(`/pulls/${pullRequestNumber}`);
            if (!response.ok) throw new Error(`cannot read pull request (HTTP ${response.status})`);
            const pullRequest = await response.json();
            const labels = pullRequest.labels?.map((label) => label.name);
            if (!Array.isArray(labels) || labels.some((label) => typeof label !== 'string')) {
              throw new Error('GitHub returned malformed pull-request labels');
            }
            const invalidPillars = labels.filter((label) => /^pillar(?:$|[-_: /])/i.test(label) && !pillars.has(label));
            if (invalidPillars.length > 0) throw new Error(`remove non-canonical pillar-like labels: ${invalidPillars.join(', ')}`);
            const body = typeof pullRequest.body === 'string' ? pullRequest.body : '';
            const pillar = resolveOne('pillar', labels.filter((label) => pillars.has(label)), declaredPillars(body));
            const changeType = resolveOne('change type', labels.filter((label) => changeTypes.has(label)), declaredChangeTypes(body));
            const additions = [pillar, changeType].filter((label) => !labels.includes(label));
            if (additions.length === 0) return;
            for (const label of additions) await ensureLabel(label);
            const updated = await request(`/issues/${pullRequestNumber}`, {
              method: 'PATCH',
              body: JSON.stringify({ labels: [...new Set([...labels, ...additions])] }),
            });
            if (!updated.ok) throw new Error(`cannot apply declared PR labels (HTTP ${updated.status})`);
            console.log(`Applied explicit declarations: ${changeType}, ${pillar}.`);
          }

          main().catch((error) => {
            console.error(`::error::${error instanceof Error ? error.message : String(error)}`);
            process.exitCode = 1;
          });
          NODE

  validate:
    name: Validate mutually exclusive PR labels
    needs: [apply-declarations]
    if: always() && (needs.apply-declarations.result == 'success' || needs.apply-declarations.result == 'skipped')
    # See apply-declarations above: moved off ubuntu-latest, no PR-code checkout here either.
    runs-on: [self-hosted, Linux, ci]
    steps:
      - name: Read live labels and enforce the organisation taxonomy
        # Skipped on `merge_group`: there is no pull request to read, and the
        # step below exits 1 without a numeric PR_NUMBER by design. The job
        # still succeeds with no steps, which is what publishes the required
        # context the queue is waiting for.
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Organisation PR label policy requires a pull_request event"
            exit 1
          fi

          labels_json="$({
            curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          } | jq -c '[.labels[].name]')"
          export LABELS_JSON="$labels_json"

          node <<'NODE'
          const labels = JSON.parse(process.env.LABELS_JSON);
          if (!Array.isArray(labels) || labels.some((label) => typeof label !== 'string')) {
            throw new Error('GitHub returned a malformed pull-request label set');
          }

          const changeTypes = new Set(['bug', 'enhancement', 'documentation', 'type:tech-debt']);
          const pillars = new Set(Array.from({ length: 8 }, (_, index) => `pillar-${index + 1}`));
          const changeTypeMatches = [...new Set(labels.filter((label) => changeTypes.has(label)))];
          const pillarMatches = [...new Set(labels.filter((label) => pillars.has(label)))];
          const invalidPillarLabels = [...new Set(labels.filter((label) =>
            /^pillar(?:$|[-_: /])/i.test(label) && !pillars.has(label),
          ))];

          const failures = [];
          if (changeTypeMatches.length !== 1) {
            failures.push(`expected exactly one change type (${[...changeTypes].join(', ')}); observed ${changeTypeMatches.length}`);
          }
          if (pillarMatches.length !== 1) {
            failures.push(`expected exactly one canonical pillar (pillar-1 … pillar-8); observed ${pillarMatches.length}`);
          }
          if (invalidPillarLabels.length > 0) {
            failures.push(`remove non-canonical pillar-like labels: ${invalidPillarLabels.join(', ')}`);
          }

          if (failures.length > 0) {
            for (const failure of failures) console.error(`::error::${failure}`);
            process.exit(1);
          }
          console.log(`Validated change type ${changeTypeMatches[0]} and mutually exclusive strategy pillar ${pillarMatches[0]}.`);
          NODE
